version: 2
updates:
  # The root manifest is a workspace that contains the source packages under sys/, so one entry
  # covers all five packages.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Stays on 0.8: the loaders that bindgen generates in build.rs are written against the
      # 0.8 interface (see Cargo.toml).
      - dependency-name: "libloading"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github_actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
      github_actions-major:
        update-types:
          - "major"
