# Automatic code review of every pull request by Claude Sonnet 5.5.
# Drafts are skipped; a maintainer starts a review there by adding the label `claude-review` to
# the pull request (the label is removed again after the run, so it works like a button and can
# be pressed again).
# Posts one summary comment and inline comments on concrete problems; it never pushes code and
# never merges.
# Verdict: if Claude finds nothing to object to, the workflow approves the pull request; if it
# has findings, it requests changes. A pull request that changes anything under `.github/` (the
# workflows and the release pipeline) is reviewed but never approved here: that approval is left
# to a maintainer. Pull requests from forks and from bots are not reviewed at all.
# Runs on the maintainer's Claude subscription, not on pay-per-use API credit: needs the
# repository secret CLAUDE_CODE_OAUTH_TOKEN (created locally with `claude setup-token`).
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

# A new push to the same PR replaces the review still running for the old commit. Adding any
# other label also starts this workflow (the job is then skipped); it gets a group of its own
# so that it does not cancel a review that is still running.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.number }}-${{
    github.event.action == 'labeled' && github.event.label.name != 'claude-review'
    && github.run_id || 'review' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Drafts are not ready for review. PRs from forks and from bots get no secrets, so the
    # review could not run there anyway. The `claude-review` label overrides the draft rule:
    # only people with triage rights or more can add labels, so it is a maintainer-only switch.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review')
        || (
          github.event.action != 'labeled'
          && !github.event.pull_request.draft
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The review is advice, not a gate: if it cannot run (token, usage limit, outage), the
      # pull request must not turn red because of it.
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        id: claude
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Review this pull request. The PR branch is checked out in the working directory.
            Read CONTRIBUTING.md first: its rules (nothing blocking, allocating, locking or
            logging per frame on a real-time path, no `unwrap` in library code, tests for new
            logic, documentation for public items, CHANGELOG entry for user-visible changes) are
            the review standard. The crate wraps C libraries and GPU driver interfaces: check
            `unsafe` code and FFI calls for memory safety, and treat every video stream handed
            to a decoder as untrusted input.

            Use `gh pr diff` to see the change and read surrounding code only where needed.
            Report only real problems: bugs, memory safety or security issues, broken rules from
            CONTRIBUTING.md, missing tests for new logic, missing CHANGELOG entry. No style nitpicks,
            no praise, no restating what the PR does.

            Post inline comments with `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) for each concrete problem. If the fix is simple and
            local (a few lines in the commented range), put it in a GitHub suggestion block
            (```suggestion ... ```) containing the complete replacement for those lines, so
            it can be applied with one click. Otherwise describe the fix in a sentence or two.
            Then post exactly one summary with `gh pr comment`: a verdict line
            ("No blocking issues" or "N issues to fix") and a short list. If there is nothing
            to report, the summary is just "No blocking issues found."
            Only post GitHub comments - don't submit review text as messages.

            Finally return your verdict as structured output: `verdict` is "approve" only if
            you found nothing to report, otherwise "findings"; `issues` is the number of
            problems you reported. Do not approve or request changes yourself; the workflow
            does that from your verdict.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","findings"]},"issues":{"type":"integer"}},"required":["verdict","issues"],"additionalProperties":false}'
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

      # The action hides Claude's output, so a failed run shows no reason. Surface only the
      # final result text (for a failed start that is the API error) as a warning.
      - name: Report why the review did not run
        if: steps.claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: |
          reason="no result in the execution log"
          if [ -f "$EXECUTION_FILE" ]; then
            reason=$(jq -r '[.[] | select(.type == "result")] | last | .result // "no reason given"' "$EXECUTION_FILE" | tr '\n' ' ' | cut -c1-500)
          fi
          echo "::warning title=Claude review did not run::$reason"

      # Turns Claude's verdict into a review. The rules are enforced here, not left to the model:
      # approval only for a clean verdict on the commit that was reviewed, and never for a pull
      # request that changes files under .github/.
      - name: Submit the verdict
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        run: |
          pulls="repos/$GITHUB_REPOSITORY/pulls/$PR"

          verdict=""
          if [[ "$CLAUDE_OUTCOME" == "success" ]]; then
            verdict=$(jq -r '.verdict // empty' <<<"$STRUCTURED" 2>/dev/null || true)
          fi

          submit() { # event, body
            gh api -X POST "$pulls/reviews" -f commit_id="$HEAD_SHA" -f event="$1" -f body="$2" --silent
          }
          # Withdraws this workflow's earlier reviews in the given states, so that an approval
          # (or a request for changes) given for an older commit does not stay in force.
          dismiss() { # jq state filter, message
            gh api --paginate "$pulls/reviews" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and ($1)) | .id" |
              while read -r id; do
                gh api -X PUT "$pulls/reviews/$id/dismissals" -f message="$2" --silent ||
                  echo "::warning::Could not dismiss the earlier review $id."
              done
          }

          if [[ "$(gh api "$pulls" --jq .head.sha)" != "$HEAD_SHA" ]]; then
            echo "::notice::The pull request has newer commits than the reviewed one; no verdict is submitted."
            exit 0
          fi

          protected=$(gh api --paginate "$pulls/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | grep -c '^\.github/' || true)

          case "$verdict" in
            approve)
              if [[ "$protected" -gt 0 ]]; then
                dismiss '.state == "APPROVED" or .state == "CHANGES_REQUESTED"' \
                  "Superseded by the review of a newer commit."
                submit COMMENT "No blocking issues found. This pull request changes files under \`.github/\`, so the approval is left to a maintainer."
                echo "::notice::Clean review, but files under .github/ are changed: not approved automatically."
              else
                submit APPROVE "No blocking issues found. Approved automatically; merging stays with a maintainer."
                echo "::notice::Clean review: pull request approved."
              fi
              ;;
            findings)
              submit REQUEST_CHANGES "The review found problems; see the comments on this pull request."
              echo "::notice::Review with findings: changes requested."
              ;;
            *)
              dismiss '.state == "APPROVED"' "The newest commit could not be reviewed."
              echo "::warning title=No verdict::The review gave no verdict; nothing was approved."
              ;;
          esac

      # Take the label off again so that adding it starts the next review.
      - name: Remove the claude-review label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/claude-review"
