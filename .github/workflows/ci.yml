name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these checks as its test suite.
  workflow_call:
  # By hand, to check a branch that has no pull request yet.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_DENY_VERSION: 0.20.2

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      # The build compiles the bundled codec sources, which needs a C/C++ compiler, CMake, NASM,
      # Meson and Ninja, and libclang for the bindings. Windows is handled below.
      - name: Install build tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                nasm meson ninja-build cmake pkg-config clang libclang-dev libva-dev ccache
              echo "/usr/lib/ccache" >> "$GITHUB_PATH"
              ;;
            macOS)
              brew install nasm meson ninja cmake ccache
              echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
              ;;
          esac

      # The steps below compile the bundled codec sources several times (Clippy, tests,
      # documentation and the package check each build them again). ccache stands in front of
      # the C and C++ compilers and hands back the object files of an earlier, identical compile,
      # so only the first run after a change to the sources pays for them. The build itself is
      # unchanged: every step still runs the complete bundled build.
      - name: Configure the compiler cache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          {
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            # Build directories differ per step; paths below the checkout are compared relative.
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=1"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_MAXSIZE=1G"
          } >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        if: runner.os != 'Windows'
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sys/**', 'build.rs') }}

      # hwcodec's build script does not compile the bundled sources on Windows. This job builds
      # them with the script that also makes the downloadable archive, once per change to the
      # sources, and hands them to the build through the variables for prebuilt libraries, so
      # the checks always run against the sources of this commit. The jobs `windows-packaged`
      # and `windows-download` below cover what users of the crate get instead.
      - name: Restore the Windows codec libraries
        if: runner.os == 'Windows'
        id: windows-libs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-libs
          key: native-libs-${{ runner.arch }}-${{ hashFiles('sys/**', '.github/scripts/build-windows-libs.sh', '.github/actions/windows-build-tools/action.yml') }}

      - name: Install the Windows build tools
        if: runner.os == 'Windows' && steps.windows-libs.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-build-tools

      - name: Build the Windows codec libraries
        if: runner.os == 'Windows' && steps.windows-libs.outputs.cache-hit != 'true'
        shell: bash
        run: .github/scripts/build-windows-libs.sh "$RUNNER_TEMP/native-libs"

      - name: Save the Windows codec libraries
        if: runner.os == 'Windows' && steps.windows-libs.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-libs
          key: ${{ steps.windows-libs.outputs.cache-primary-key }}

      - name: Point the build at the Windows codec libraries
        if: runner.os == 'Windows'
        shell: bash
        run: |
          libs=$(cygpath -m "$RUNNER_TEMP/native-libs")
          {
            echo "LIBVPX_STATIC_DIR=$libs/libvpx_static"
            echo "SVTAV1_STATIC_DIR=$libs/svtav1_static"
            echo "DAV1D_STATIC_DIR=$libs/dav1d_static"
            echo "HWENC_SDK_DIR=$libs/hwenc_sdk"
          } >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Documentation
        run: cargo doc --no-deps

      - name: Examples
        run: cargo build --examples

      # Builds with fewer cargo features than the default, as the phone builds of an application
      # use the crate: Clippy, tests and documentation for each reduced set. Each set compiles
      # the bundled sources of its codecs again, which the compiler cache keeps short.
      - name: Reduced feature sets
        if: runner.os == 'Linux'
        run: .github/scripts/feature-sets.sh sets

      # Android and iOS without any feature. Only the rustup targets are installed: no NDK and
      # no Xcode, and the script hides libclang, pkg-config and the C compilers from the build,
      # so this fails if a build without features ever needs native code. Compiled, never run.
      - name: Phone targets without features
        if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-linux-android aarch64-apple-ios
          .github/scripts/feature-sets.sh phones

      # What the README promises to a newcomer: a new, empty project outside this checkout that
      # only adds hwcodec builds the bundled codec sources by itself and encodes and decodes AV1
      # and VP9. No variable selects other libraries here. Windows has its own two jobs below.
      - name: Fresh project (bundled sources)
        if: runner.os != 'Windows'
        run: .github/scripts/fresh-project.sh bundled

      - name: Restore cargo-deny
        if: runner.os == 'Linux'
        id: deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: runner.os == 'Linux' && steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"

      - name: Licence check
        if: runner.os == 'Linux'
        run: cargo deny check licenses

      - name: Package dry run
        if: runner.os == 'Linux'
        # All six packages as a release would upload them, including the one with the prebuilt
        # Windows libraries, which is filled from the pinned archive and compared with it.
        run: .github/scripts/package-all.sh

      - name: Compiler cache statistics
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats

      # Only main saves: a cache saved by a pull request is not visible to other branches, and
      # the key only changes with the bundled sources.
      - name: Save the compiler cache
        if: runner.os != 'Windows' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

  # What somebody who takes the crate from crates.io gets on Windows: the companion package
  # holds the prebuilt codec libraries, and the build links them without any download. The
  # package is filled here the way the release pipeline fills it before publishing.
  windows-packaged:
    name: windows-latest (packaged libraries)
    runs-on: windows-latest
    env:
      # Proves that nothing is downloaded: with this set, a build that needed the download fails.
      HWCODEC_NO_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Fill the package with the pinned libraries
        shell: bash
        run: .github/scripts/fetch-windows-prebuilt.sh

      - name: Tests
        run: cargo test

      - name: Examples
        run: cargo build --examples

      # A new, empty project outside this checkout that only adds hwcodec: it must link the
      # libraries of the package and round-trip AV1 and VP9, with the download still forbidden.
      - name: Fresh project (packaged libraries)
        shell: bash
        run: .github/scripts/fresh-project.sh packaged

  # What somebody who builds a git checkout on Windows gets: the companion package is empty
  # and no variables are set, so the build script downloads the prebuilt codec libraries pinned
  # in build.rs, checks them and links them.
  windows-download:
    name: windows-latest (downloaded libraries)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Tests
        run: cargo test

      - name: Examples
        run: cargo build --examples

      # A new, empty project outside this checkout that only adds hwcodec: its own build
      # downloads the pinned archive again, and the step fails unless the libraries it linked
      # are the ones unpacked from that download.
      - name: Fresh project (downloaded libraries)
        shell: bash
        run: .github/scripts/fresh-project.sh downloaded

      - name: The download can be forbidden
        shell: bash
        env:
          HWCODEC_NO_DOWNLOAD: 1
        run: |
          # A fresh build directory, so that nothing unpacked earlier is reused.
          if cargo check --target-dir "$RUNNER_TEMP/no-download" 2> "$RUNNER_TEMP/no-download.log"; then
            echo "::error::The build succeeded although HWCODEC_NO_DOWNLOAD forbids the download."
            exit 1
          fi
          grep -q "HWCODEC_NO_DOWNLOAD forbids downloading" "$RUNNER_TEMP/no-download.log"
