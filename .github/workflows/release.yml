# Releases hwcodec: publishes the six packages to crates.io and creates the GitHub release.
#
# Starts when a version tag (vX.Y.Z) is pushed. Started by hand (Actions -> Release -> Run
# workflow) it is a rehearsal by default: everything is checked and packaged, but nothing is
# published and no release is created. A real publish only ever happens from a version tag.
# The steps for the maintainer are in RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearsal: check and package only, publish nothing and create no release."
        type: boolean
        default: true

permissions:
  contents: read

# crates.io versions can never be replaced; never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # A pushed tag is always a real release; a run started by hand is one only if the box
  # "dry_run" was cleared.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  check:
    name: Check version and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Say what this run does
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice title=Dry run::Rehearsal only. Nothing is published to crates.io and no GitHub release is created."
          else
            echo "::notice title=Real release::This run publishes to crates.io and creates the GitHub release for $GITHUB_REF_NAME."
          fi

      - name: A real release needs a version tag
        if: env.DRY_RUN != 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::A real release only runs from a version tag (vX.Y.Z). Push the tag, or keep dry_run switched on."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # All six packages carry the same version; the source packages add the version of the
      # library they bundle after a plus sign (0.1.0+1.15.2) and the package with the prebuilt
      # Windows libraries the release they come from (0.1.0+native-libs.1), which is ignored here.
      - name: Check the package versions
        id: version
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '.packages[] | select(.name == "hwcodec") | .version' <<<"$metadata")
          echo "hwcodec is at version $version"
          failed=false
          while read -r name package_version; do
            if [[ "${package_version%%+*}" != "$version" ]]; then
              echo "::error::$name is at $package_version, but hwcodec is at $version. All six packages must carry the same version."
              failed=true
            fi
          done < <(jq -r '.packages[] | "\(.name) \(.version)"' <<<"$metadata")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the package version $version."
            failed=true
          fi
          [[ "$failed" == false ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release needs its own section in the changelog. A rehearsal may run before that
      # section exists; it then shows the notes that are collected under "Unreleased".
      - name: Check the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if notes=$(.github/scripts/changelog-section.sh "$VERSION"); then
            echo "CHANGELOG.md has a section for $VERSION."
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "::notice::CHANGELOG.md has no section [$VERSION] yet. The release itself needs one; this rehearsal shows [Unreleased] instead."
            notes=$(.github/scripts/changelog-section.sh Unreleased)
          else
            echo "::error::CHANGELOG.md has no section [$VERSION]. Rename [Unreleased] to [$VERSION] before tagging (see RELEASING.md)."
            exit 1
          fi
          {
            echo "## Release notes for hwcodec $VERSION"
            echo
            echo "$notes"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    needs: check
    uses: ./.github/workflows/ci.yml

  # On Windows, hwcodec links prebuilt codec libraries. They come from a release of this
  # repository of its own (native-libs-<n>, made by the workflow "Windows codec libraries") that
  # build.rs pins by tag and SHA-256, and the publish job below packs exactly that archive into
  # the package hwcodec-prebuilt-x86_64-pc-windows-msvc. This job only reads: it makes sure,
  # early, that the pinned archive exists, has the pinned checksum, holds the library versions
  # this release bundles and is the one the package version names.
  windows-prebuilt:
    name: Windows prebuilt libraries
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pinned archive
        run: .github/scripts/fetch-windows-prebuilt.sh "$RUNNER_TEMP/prebuilt-check"

  publish:
    name: Publish to crates.io
    needs: [check, tests, windows-prebuilt]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # crates.io Trusted Publishing is registered for this workflow file and this environment.
    environment: release
    permissions:
      contents: read
      id-token: write # lets crates.io verify that this workflow is the one asking for a token
    env:
      # Dependency order: the four source packages and the prebuilt Windows libraries first,
      # hwcodec depends on them.
      PACKAGES: >-
        hwcodec-libvpx-src hwcodec-svt-av1-src hwcodec-dav1d-src hwcodec-libvpl-src
        hwcodec-prebuilt-x86_64-pc-windows-msvc hwcodec
      # Only needed for the very first publish: Trusted Publishing works once a package exists
      # on crates.io. While this secret is set it is used; without it, Trusted Publishing is.
      HAVE_TOKEN_SECRET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: Say what this run does
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "=================================================================="
            echo " DRY RUN - nothing is published to crates.io, no release is made"
            echo "=================================================================="
            echo "::notice title=Dry run::The packages are only built and checked. Nothing is published."
          else
            echo "=================================================================="
            echo " REAL PUBLISH - the packages go to crates.io and cannot be removed"
            echo "=================================================================="
            echo "::notice title=Real publish::Publishing $GITHUB_REF_NAME to crates.io."
          fi

      - name: A real publish needs a version tag
        if: env.DRY_RUN != 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::A real publish only runs from a version tag (vX.Y.Z)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Publishing builds each package once more from the packaged files, which compiles the
      # bundled codec sources.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm meson ninja-build cmake pkg-config clang libclang-dev libva-dev

      - name: See which versions are already on crates.io
        id: plan
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          todo=()
          for name in $PACKAGES; do
            version=$(jq -r --arg name "$name" '.packages[] | select(.name == $name) | .version' <<<"$metadata")
            if .github/scripts/crates-io-has.sh "$name" "$version"; then
              echo "::notice::$name $version is already on crates.io; it is skipped."
            else
              echo "$name $version is not on crates.io yet."
              todo+=("$name")
            fi
          done
          echo "todo=${todo[*]}" >> "$GITHUB_OUTPUT"

      # The rehearsal: build every package exactly as it would be uploaded, the one with the
      # prebuilt Windows libraries filled from the pinned archive and compared with it.
      - name: Package (dry run)
        if: env.DRY_RUN == 'true'
        env:
          TODO: ${{ steps.plan.outputs.todo }}
        run: |
          .github/scripts/package-all.sh
          echo "::notice title=Dry run finished::A real release would now publish: ${TODO:-nothing, every version is already on crates.io}."

      - name: Get a short-lived crates.io token (Trusted Publishing)
        id: auth
        if: env.DRY_RUN != 'true' && env.HAVE_TOKEN_SECRET != 'true' && steps.plan.outputs.todo != ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: env.DRY_RUN != 'true' && steps.plan.outputs.todo != ''
        env:
          TODO: ${{ steps.plan.outputs.todo }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          if [[ "$DRY_RUN" == "true" || "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Refusing to publish: this is a dry run or not a version tag."
            exit 1
          fi
          metadata=$(cargo metadata --no-deps --format-version 1)
          for name in $TODO; do
            version=$(jq -r --arg name "$name" '.packages[] | select(.name == $name) | .version' <<<"$metadata")
            echo "::group::Publish $name $version"
            if [[ "$name" == hwcodec-prebuilt-* ]]; then
              # The libraries are not in git: fetch the pinned archive, pack, and only publish
              # if the packed libraries are exactly the archive's. cargo packs files outside
              # git only with --allow-dirty, so the checkout must otherwise equal the tag.
              .github/scripts/fetch-windows-prebuilt.sh
              if [[ -n $(git status --porcelain) ]]; then
                echo "::error::The checkout differs from git; refusing to publish $name."
                git status --short
                exit 1
              fi
              cargo package -p "$name" --allow-dirty
              .github/scripts/verify-prebuilt-package.sh "target/package/$name-$version.crate"
              cargo publish -p "$name" --allow-dirty
            else
              cargo publish -p "$name"
            fi
            echo "::endgroup::"
            # The next package can only be built once this one can be downloaded.
            for attempt in $(seq 1 60); do
              if .github/scripts/crates-io-has.sh "$name" "$version"; then
                echo "$name $version is on crates.io."
                continue 2
              fi
              echo "Waiting for $name $version to appear in the crates.io index ($attempt/60)"
              sleep 10
            done
            echo "::error::$name $version did not appear in the crates.io index within 10 minutes. Run the workflow again from the tag; versions that are already published are skipped."
            exit 1
          done

  github-release:
    name: GitHub release
    needs: [check, publish]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: A real release needs a version tag
        if: env.DRY_RUN == 'true' || !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::A release is only created from a version tag (vX.Y.Z)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::The release $GITHUB_REF_NAME already exists; it is left as it is."
            exit 0
          fi
          .github/scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "hwcodec $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
