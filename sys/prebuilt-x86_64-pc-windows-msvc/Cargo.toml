[package]
name = "hwcodec-prebuilt-x86_64-pc-windows-msvc"
description = "Prebuilt static libvpx, SVT-AV1, dav1d and Intel VPL dispatcher for x86_64-pc-windows-msvc, for the hwcodec crate's build"
# The part after the plus sign names the `native-libs` release of the hwcodec repository whose
# archive the `prebuilt/` directory is unpacked from. It moves together with `PREBUILT_TAG` in
# hwcodec's build.rs.
version = "0.1.0+native-libs.3"
edition = "2024"
rust-version = "1.90"
license = "BSD-3-Clause AND BSD-3-Clause-Clear AND BSD-2-Clause AND MIT"
repository = "https://github.com/Mumcord/hwcodec"
readme = "README.md"
keywords = ["av1", "vp9", "video", "windows", "hwcodec"]
categories = ["multimedia::video"]
# `prebuilt/` is not in git: the release pipeline fills it from the checksummed archive before
# packaging (.github/scripts/fetch-windows-prebuilt.sh).
include = ["/Cargo.toml", "/README.md", "/src/**", "/prebuilt/**"]

[lints.rust]
missing_docs = "warn"
